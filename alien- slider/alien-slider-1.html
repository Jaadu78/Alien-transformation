<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Omnitrix Alien Slider</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600&display=swap');

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #050705;
  }
  body {
    min-height: 100vh;
    width: 100%;
    background: radial-gradient(120% 90% at 50% -10%, #0f1c13 0%, #070b08 55%, #050705 100%);
    color: #eef2ee;
    font-family: 'Inter', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
    position: relative;
  }

  button { font-family: inherit; }

  .omni-scan { animation: omniPulse 2.4s ease-in-out infinite; }
  @keyframes omniPulse {
    0%, 100% { opacity: 0.55; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.06); }
  }
  .alien-card {
    transition: transform 0.55s cubic-bezier(.22,.9,.32,1), opacity 0.55s ease, filter 0.55s ease;
  }
  .dot { transition: all 0.35s ease; }
  .nav-btn { transition: background 0.2s ease, transform 0.15s ease, border-color 0.2s ease; }
  .nav-btn:hover { transform: scale(1.08); }
  .nav-btn:active { transform: scale(0.95); }

  @keyframes spotlightIconIn {
    from { opacity: 0; transform: translateX(46px) scale(0.85); }
    to   { opacity: 1; transform: translateX(0) scale(1); }
  }
  @keyframes spotlightTextIn {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes shadowDrift {
    from { opacity: 0; transform: translate(70px, -6px) scale(0.9) rotate(-6deg); }
    to   { opacity: 0.16; transform: translate(46px, -6px) scale(1) rotate(-6deg); }
  }
  .spotlight-icon-enter { animation: spotlightIconIn 0.5s cubic-bezier(.22,.9,.32,1); }
  .spotlight-text-enter { animation: spotlightTextIn 0.5s cubic-bezier(.22,.9,.32,1); }
  .spotlight-shadow-enter { animation: shadowDrift 0.6s cubic-bezier(.22,.9,.32,1) forwards; }

  @media (prefers-reduced-motion: reduce) {
    .alien-card, .omni-scan,
    .spotlight-icon-enter, .spotlight-text-enter, .spotlight-shadow-enter {
      animation: none !important;
      transition: none !important;
    }
  }

  /* ---- layout ---- */
  .top-bar {
    width: 100%;
    max-width: 960px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 28px 24px 0;
  }
  .wordmark {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: 0.14em;
    color: #eef2ee;
  }
  .accent-color { transition: color 0.5s; }

  .dial { position: relative; width: 46px; height: 46px; }
  #dial-ring {
    position: absolute; inset: 0; border-radius: 50%;
  }
  #dial-center {
    position: absolute; inset: 10px; border-radius: 50%;
    transition: background 0.5s;
  }

  .eyebrow {
    margin-top: 40px;
    font-family: 'Rajdhani', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    transition: color 0.5s;
    text-align: center;
    padding: 0 16px;
  }

  .carousel-wrap {
    position: relative;
    width: 100%;
    max-width: 1000px;
    height: 340px;
    margin-top: 18px;
    perspective: 1400px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .carousel { position: relative; width: 100%; height: 100%; }

  .alien-card {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 190px;
    height: 260px;
    margin-left: -95px;
    margin-top: -130px;
    border-radius: 18px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
  }
  .alien-card .icon-circle {
    width: 74px; height: 74px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  .alien-card .card-name {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 16px;
    text-align: center;
    padding: 0 14px;
    letter-spacing: 0.02em;
  }

  .hero-text { margin-top: 26px; text-align: center; max-width: 480px; padding: 0 20px; }
  .hero-text h1 {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 34px;
    margin: 0;
    letter-spacing: 0.01em;
    color: #f4f7f3;
  }
  .hero-text p {
    margin-top: 8px;
    font-size: 14.5px;
    line-height: 1.6;
    color: #a3b0a4;
  }

  .controls { margin-top: 22px; display: flex; align-items: center; gap: 20px; }
  .round-btn {
    width: 42px; height: 42px; border-radius: 50%;
    border: 1px solid #2a3128; background: #0e140f; color: #dfe7e0;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .dots { display: flex; gap: 8px; }
  .dot {
    height: 8px; border-radius: 4px; border: none; cursor: pointer; background: #2a3128;
  }

  .spotlight {
    width: 100%;
    position: relative;
    overflow: hidden;
    padding: 72px 24px;
    border-top: 1px solid #181d18;
    transition: background 0.7s ease;
  }
  .spotlight-inner {
    max-width: 1000px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 48px;
  }
  .spotlight-illustration {
    flex: 1 1 320px;
    position: relative;
    height: 340px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .spotlight-glow {
    position: absolute;
    width: 260px; height: 260px;
    border-radius: 50%;
    opacity: 0.25;
    filter: blur(60px);
    transition: background 0.7s ease;
  }
  #spotlight-shadow-wrap { position: absolute; right: -10px; display: flex; }
  #spotlight-icon-wrap {
    position: relative;
    width: 150px; height: 150px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    transition: background 0.5s ease, border-color 0.5s ease, box-shadow 0.5s ease;
  }
  #spotlight-icon-fallback {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  #spotlight-icon-img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    display: none;
  }
  .mute-btn {
    position: absolute; top: 8px; right: 8px;
    width: 38px; height: 38px; border-radius: 50%;
    border: 1px solid #2a3128; background: #0e140fcc; color: #dfe7e0;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .media-strip {
    position: absolute;
    bottom: 6px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 8px 14px;
    border-radius: 999px;
    background: #0e140fcc;
    border: 1px solid #23291f;
  }
  .strip-btn { background: none; border: none; color: #dfe7e0; cursor: pointer; display: flex; }
  .play-btn {
    width: 40px; height: 40px; border-radius: 50%; border: none;
    color: #0a0f0c; display: flex; align-items: center; justify-content: center; cursor: pointer;
    transition: background 0.5s ease;
  }

  .spotlight-text { flex: 1 1 320px; min-width: 280px; }
  .spotlight-label {
    font-family: 'Rajdhani', sans-serif;
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    margin-bottom: 10px;
    transition: color 0.5s;
  }
  .spotlight-text h2 {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 42px;
    margin: 0;
    color: #f4f7f3;
    line-height: 1.05;
  }
  .spotlight-text p {
    margin-top: 16px;
    font-size: 15px;
    line-height: 1.75;
    color: #b7c2b8;
    max-width: 460px;
  }
  .spotlight-badge {
    margin-top: 22px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    border-radius: 999px;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 600;
    font-size: 12.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    transition: color 0.5s, border-color 0.5s;
  }
</style>
</head>
<body>

  <div class="top-bar">
    <div class="wordmark">OMNI<span id="wordmark-accent" class="accent-color">TRIX</span></div>
    <div class="dial">
      <div id="dial-ring" class="omni-scan"></div>
      <div id="dial-center"></div>
    </div>
  </div>

  <div id="eyebrow" class="eyebrow"></div>

  <div class="carousel-wrap">
    <div id="carousel" class="carousel"></div>
  </div>

  <div class="hero-text">
    <h1 id="hero-name"></h1>
    <p id="hero-tagline"></p>
  </div>

  <div class="controls">
    <button id="prevBtn" class="nav-btn round-btn" aria-label="Previous alien"></button>
    <div id="dots" class="dots"></div>
    <button id="nextBtn" class="nav-btn round-btn" aria-label="Next alien"></button>
  </div>

  <div style="height:36px"></div>

  <div id="spotlight" class="spotlight">
    <div class="spotlight-inner">
      <div class="spotlight-illustration">
        <div id="spotlight-glow" class="spotlight-glow"></div>
        <div id="spotlight-shadow-wrap"></div>
        <div id="spotlight-icon-wrap">
          <div id="spotlight-icon-fallback"></div>
          <img id="spotlight-icon-img" alt="" />
        </div>
        <button id="muteBtn" class="nav-btn mute-btn" aria-label="Unmute"></button>
        <div class="media-strip">
          <button id="spPrev" class="nav-btn strip-btn" aria-label="Previous alien"></button>
          <button id="playPauseBtn" class="play-btn" aria-label="Pause"></button>
          <button id="spNext" class="nav-btn strip-btn" aria-label="Next alien"></button>
        </div>
      </div>
      <div id="spotlight-text" class="spotlight-text">
        <div id="spotlight-label" class="spotlight-label">Spotlight</div>
        <h2 id="spotlight-name"></h2>
        <p id="spotlight-desc"></p>
        <div id="spotlight-badge" class="spotlight-badge"></div>
      </div>
    </div>
  </div>

<script>
/* ---------------- icon helper (generic outline icons, lucide-inspired) ---------------- */
function icon(name, color, size, strokeWidth) {
  color = color || 'currentColor';
  size = size || 24;
  strokeWidth = strokeWidth || 1.75;
  const s = `width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="${strokeWidth}" stroke-linecap="round" stroke-linejoin="round"`;
  switch (name) {
    case 'flame':
      return `<svg ${s}><path d="M12 3c1 3-2 4-2 7a4 4 0 1 0 8 0c0-1-.5-2-.5-2s0 1.5-1.5 1.5c0-2.5-2-3-2-5 0 2-1.5 3-1.5 5 0 0-1-1-1-2.5C11.5 5 12 4 12 3z"/></svg>`;
    case 'zap':
      return `<svg ${s}><polygon points="13 2 4 14 11 14 10 22 20 10 13 10 13 2" fill="${color}" stroke="none"/></svg>`;
    case 'dumbbell':
      return `<svg ${s}><line x1="6" y1="12" x2="18" y2="12"/><rect x="2" y="8" width="4" height="8" rx="1" fill="${color}" stroke="none"/><rect x="18" y="8" width="4" height="8" rx="1" fill="${color}" stroke="none"/></svg>`;
    case 'gem':
      return `<svg ${s}><polygon points="12 2 22 9 12 22 2 9"/><path d="M2 9h20"/><path d="M9 2 6 9l6 13 6-13-3-7"/></svg>`;
    case 'ghost':
      return `<svg ${s}><path d="M12 2a7 7 0 0 0-7 7v11.5l2.5-2 2.5 2 2-2 2 2 2.5-2 2.5 2V9a7 7 0 0 0-7-7z"/><circle cx="9.5" cy="10" r="0.9" fill="${color}" stroke="none"/><circle cx="14.5" cy="10" r="0.9" fill="${color}" stroke="none"/></svg>`;
    case 'cpu':
      return `<svg ${s}><rect x="6" y="6" width="12" height="12" rx="2"/><rect x="9" y="9" width="6" height="6" fill="${color}" stroke="none"/><line x1="9" y1="2" x2="9" y2="5"/><line x1="15" y1="2" x2="15" y2="5"/><line x1="9" y1="19" x2="9" y2="22"/><line x1="15" y1="19" x2="15" y2="22"/><line x1="2" y1="9" x2="5" y2="9"/><line x1="2" y1="15" x2="5" y2="15"/><line x1="19" y1="9" x2="22" y2="9"/><line x1="19" y1="15" x2="22" y2="15"/></svg>`;
    case 'bug':
      return `<svg ${s}><ellipse cx="12" cy="14" rx="6" ry="7"/><line x1="9" y1="3" x2="10.5" y2="6"/><line x1="15" y1="3" x2="13.5" y2="6"/><line x1="2" y1="11" x2="6" y2="11"/><line x1="2" y1="15" x2="6" y2="15"/><line x1="2" y1="19" x2="6.5" y2="17.5"/><line x1="22" y1="11" x2="18" y2="11"/><line x1="22" y1="15" x2="18" y2="15"/><line x1="22" y1="19" x2="17.5" y2="17.5"/><line x1="12" y1="8" x2="12" y2="21"/></svg>`;
    case 'snowflake':
      return `<svg ${s}><line x1="12" y1="2" x2="12" y2="22"/><line x1="3.5" y1="7" x2="20.5" y2="17"/><line x1="3.5" y1="17" x2="20.5" y2="7"/><line x1="12" y1="2" x2="9.5" y2="4.5"/><line x1="12" y1="2" x2="14.5" y2="4.5"/><line x1="12" y1="22" x2="9.5" y2="19.5"/><line x1="12" y1="22" x2="14.5" y2="19.5"/></svg>`;
    case 'cat':
      return `<svg ${s}><path d="M4 8 8 4v4"/><path d="M20 8 16 4v4"/><path d="M6 8h12a2 2 0 0 1 2 2v5a7 7 0 0 1-7 7h-2a7 7 0 0 1-7-7v-5a2 2 0 0 1 2-2z"/><line x1="9.5" y1="14" x2="9.5" y2="14.5"/><line x1="14.5" y1="14" x2="14.5" y2="14.5"/><path d="M11 17h2"/></svg>`;
    case 'brain':
      return `<svg ${s}><path d="M9 3a3 3 0 0 0-3 3v1a3 3 0 0 0-2 2.8V12a3 3 0 0 0 1 2.2V16a3 3 0 0 0 3 3h1"/><path d="M15 3a3 3 0 0 1 3 3v1a3 3 0 0 1 2 2.8V12a3 3 0 0 1-1 2.2V16a3 3 0 0 1-3 3h-1"/><path d="M12 3v18"/></svg>`;
    case 'fish':
      return `<svg ${s}><path d="M2 12c3-4 8-6 13-6 3 0 5 2 7 6-2 4-4 6-7 6-5 0-10-2-13-6z"/><circle cx="15" cy="10.5" r="0.8" fill="${color}" stroke="none"/><path d="M2 12 5 9"/><path d="M2 12 5 15"/></svg>`;
    case 'paw':
      return `<svg ${s}><circle cx="6" cy="9" r="2"/><circle cx="10" cy="6" r="2"/><circle cx="14" cy="6" r="2"/><circle cx="18" cy="9" r="2"/><path d="M8 14c0-2 2-3 4-3s4 1 4 3-2 5-4 5-4-3-4-5z"/></svg>`;
    case 'ball':
      return `<svg ${s}><circle cx="12" cy="12" r="7"/><line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/></svg>`;
    case 'copy':
      return `<svg ${s}><rect x="4" y="4" width="12" height="12" rx="2"/><rect x="9" y="9" width="12" height="12" rx="2"/></svg>`;
    case 'eye':
      return `<svg ${s}><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>`;
    case 'leaf':
      return `<svg ${s}><path d="M11 20A7 7 0 0 1 4 13c0-6 7-11 7-11s7 5 7 11a7 7 0 0 1-7 7z"/><path d="M11 20 4 13"/></svg>`;
    case 'hexagon':
      return `<svg ${s}><polygon points="12 2 21 7 21 17 12 22 3 17 3 7"/></svg>`;
    case 'echo':
      return `<svg ${s}><circle cx="12" cy="12" r="2" fill="${color}" stroke="none"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="10"/></svg>`;
    case 'shield':
      return `<svg ${s}><path d="M12 2 4 6v6c0 5 3.5 8.5 8 10 4.5-1.5 8-5 8-10V6z"/></svg>`;
    case 'spider':
      return `<svg ${s}><circle cx="12" cy="12" r="3"/><line x1="9" y1="10" x2="3" y2="6"/><line x1="9" y1="12" x2="2" y2="12"/><line x1="9" y1="14" x2="3" y2="18"/><line x1="15" y1="10" x2="21" y2="6"/><line x1="15" y1="12" x2="22" y2="12"/><line x1="15" y1="14" x2="21" y2="18"/><line x1="10" y1="9" x2="9" y2="4"/><line x1="14" y1="9" x2="15" y2="4"/></svg>`;
    case 'chevronLeft':
      return `<svg ${s}><polyline points="15 18 9 12 15 6"/></svg>`;
    case 'chevronRight':
      return `<svg ${s}><polyline points="9 18 15 12 9 6"/></svg>`;
    case 'play':
      return `<svg width="${size}" height="${size}" viewBox="0 0 24 24"><polygon points="6 4 20 12 6 20" fill="${color}"/></svg>`;
    case 'pause':
      return `<svg width="${size}" height="${size}" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" fill="${color}"/><rect x="14" y="4" width="4" height="16" fill="${color}"/></svg>`;
    case 'volume2':
      return `<svg ${s}><polygon points="3 9 8 9 13 4 13 20 8 15 3 15" fill="${color}" stroke="none"/><path d="M17 8a5 5 0 0 1 0 8"/><path d="M20 5a9 9 0 0 1 0 14"/></svg>`;
    case 'volumeX':
      return `<svg ${s}><polygon points="3 9 8 9 13 4 13 20 8 15 3 15" fill="${color}" stroke="none"/><line x1="17" y1="9" x2="23" y2="15"/><line x1="23" y1="9" x2="17" y2="15"/></svg>`;
    default:
      return '';
  }
}

/* ---------------- data ---------------- */
/* Put your image files next to this HTML file (or change this to something
   like "images/" if you keep them in a subfolder). Each filename below must
   match exactly, including spaces — e.g. "Four Arms.jpg". */
const IMAGE_FOLDER = "";

const ALIENS = [
  { name: "Heatblast", codename: "Heat-class", color: "#ff6a3d", icon: "flame", image: IMAGE_FOLDER + "Heatblast.jpg",
    tagline: "Combusts on contact. Runs hot enough to melt steel in seconds.",
    description: "Living magma held together by force of will. Flight comes from self-generated thrust, and every strike leaves a scorch mark. Calm under pressure, but push it too far and the room stops being a metaphor for hot." },
  { name: "XLR8", codename: "Velocity-class", color: "#38bdf8", icon: "zap", image: IMAGE_FOLDER + "XLR8.jpg",
    tagline: "Outruns sound itself. Reflexes measured in milliseconds.",
    description: "Built for speed above everything else — four legs, a low center of gravity, and reflexes that make normal conversation feel painfully slow. Covers ground faster than sound and thinks just as quickly, though patience was never part of the design." },
  { name: "Four Arms", codename: "Force-class", color: "#ff3c5e", icon: "dumbbell", image: IMAGE_FOLDER + "Four Arms.jpg",
    tagline: "Four arms, zero patience. Strength that bends steel beams.",
    description: "Four powerful arms and a hide tough enough to shrug off gunfire. Subtlety isn't in the toolkit — most fights end the moment it closes the distance, and closing distance is what those legs are for." },
  { name: "Diamondhead", codename: "Crystal-class", color: "#2dd4bf", icon: "gem", image: IMAGE_FOLDER + "Diamondhead.jpg",
    tagline: "Living crystal armor. Nearly impossible to shatter.",
    description: "A body of living crystal, dense enough to turn away blades and blasts alike. Limbs reshape into blades or hammers on demand. Fights like a geometry problem that's already been solved." },
  { name: "Grey Matter", codename: "Genius-class", color: "#94a3b8", icon: "brain", image: IMAGE_FOLDER + "Grey Matter.jpg",
    tagline: "Tiny body, massive brain. Out-thinks everything twice its size.",
    description: "Small, green, and easily the smartest thing in the room. Trades size and strength for a brain built to reverse-engineer alien tech on the fly — the trick is surviving long enough to use it." },
  { name: "Stinkfly", codename: "Swarm-class", color: "#7cff3c", icon: "bug", image: IMAGE_FOLDER + "Stinkfly.jpg",
    tagline: "Four wings, compound eyes. Spits corrosive slime on command.",
    description: "Four wings and compound eyes give total awareness of a fight from above. A corrosive slime spat from the mouth eats through most materials in seconds. Easy to underestimate — right up until it's overhead." },
  { name: "Ripjaws", codename: "Aquatic-class", color: "#22d3ee", icon: "fish", image: IMAGE_FOLDER + "Ripjaws.jpg",
    tagline: "Built for the deep. Teeth first, questions later.",
    description: "At home in open water, built with fins, gills, and a jaw full of teeth for closing arguments. Slow and awkward on land, but underwater nothing outswims it." },
  { name: "Wildmutt", codename: "Feral-class", color: "#f59e0b", icon: "paw", image: IMAGE_FOLDER + "Wildmutt.jpg",
    tagline: "Blind, feral, and faster than it looks. Hunts by scent alone.",
    description: "No eyes, but it doesn't need any — a nose and quills tuned to sound do the work instead. Fast, feral, and built for the hunt, it tracks by scent from the moment a fight starts." },
  { name: "Upgrade", codename: "Circuit-class", color: "#ffe23c", icon: "cpu", image: IMAGE_FOLDER + "Upgrade.jpg",
    tagline: "Living circuitry. Merges with any machine it touches.",
    description: "Living circuitry that flows into and pilots almost any machine it touches, turning enemy tech into a liability. Its natural form is a fluid metal alloy, tough to pin down and even tougher to permanently damage." },
  { name: "Ghostfreak", codename: "Phase-class", color: "#b93cff", icon: "ghost", image: IMAGE_FOLDER + "Ghostfreak.jpg",
    tagline: "Slips through walls. Watches longer than it needs to.",
    description: "Intangible, near-invisible, and unnervingly patient. Slips through walls and possesses machinery with equal ease, watching from the shadows longer than it needs to just because it can." },
  { name: "Cannonbolt", codename: "Armor-class", color: "#fbbf24", icon: "ball", image: IMAGE_FOLDER + "Cannonbolt.jpg",
    tagline: "Curls into an armored ball and rolls faster than it runs.",
    description: "A thick armored shell built for rolling, not walking. Curls up and launches into a spinning battering ram that flattens anything in a straight line. Slow to start, nearly unstoppable once moving." },
  { name: "Ditto", codename: "Clone-class", color: "#a3e635", icon: "copy", image: IMAGE_FOLDER + "Ditto.jpg",
    tagline: "One becomes many. Every copy shares the same hit points.",
    description: "Touch triggers an instant duplicate — soon there's a whole squad working the same problem from different angles. The catch: every copy feels the same damage, so a hit to one is a hit to all." },
  { name: "Eye Guy", codename: "Sensor-class", color: "#34d399", icon: "eye", image: IMAGE_FOLDER + "Eye Guy.jpg",
    tagline: "A hundred eyes, zero blind spots.",
    description: "Covered head to toe in independently-moving eyes, this alien sees in every direction at once. Optic blasts fire from any eye on command, making a sneak attack from any angle basically impossible." },
  { name: "Swampfire", codename: "Bio-class", color: "#4ade80", icon: "leaf", image: IMAGE_FOLDER + "Swampfire.jpg",
    tagline: "Regenerates from a seed pod. Breathes literal fire.",
    description: "Part plant, part flamethrower — roots regrow lost limbs and seed pods sprout backup bodies if things go wrong. Spits fire from its hands and pulls extra ammunition straight out of its own arm." },
  { name: "Chromastone", codename: "Solar-class", color: "#f472b6", icon: "hexagon", image: IMAGE_FOLDER + "Chromastone.jpg",
    tagline: "Feeds on light, fires it back as a solar beam.",
    description: "A crystalline body that absorbs any form of energy thrown at it and converts the excess into a focused solar beam. The brighter the fight, the stronger it gets — which makes it a bad idea to bring lasers." },
  { name: "Echo Echo", codename: "Sonic-class", color: "#60a5fa", icon: "echo", image: IMAGE_FOLDER + "Echo Echo.jpg",
    tagline: "Duplicates on command, fights in stereo sound.",
    description: "A small sonic alien that splits into an entire chorus with a single move, then combines every copy's scream into a single wall-leveling sound wave. Works just as well solo, sneaking through gaps its full-size forms can't." },
  { name: "Big Chill", codename: "Phase-class", color: "#c4b5fd", icon: "snowflake", image: IMAGE_FOLDER + "Big Chill.jpg",
    tagline: "Phases through walls, breathes air cold enough to freeze flame.",
    description: "Moth-like wings let it fly and turn intangible at the same time, drifting straight through solid walls. A blast of freezing breath drops the temperature fast enough to put out fires mid-burn." },
  { name: "Spidermonkey", codename: "Climb-class", color: "#a78bfa", icon: "spider", image: IMAGE_FOLDER + "Spidermonkey.jpg",
    tagline: "Four arms, a tail, and webbing that holds like steel cable.",
    description: "Built for climbing and swinging, with an extra pair of arms and a prehensile tail doing most of the work. Fires webbing strong enough to bind or swing from, and covers ground overhead faster than anything can follow underneath." },
  { name: "Brainstorm", codename: "Genius-class", color: "#fb7185", icon: "shield", image: IMAGE_FOLDER + "Brainstorm.jpg",
    tagline: "A living supercomputer under a cracked-open skull-helmet.",
    description: "A crustacean-brained genius whose exposed cranium doubles as an antenna, boosting its own electrical and mental output mid-fight. Prefers outsmarting a problem, but the claws and electric jolts work fine as a backup plan." },
  { name: "Rath", codename: "Rage-class", color: "#dc2626", icon: "cat", image: IMAGE_FOLDER + "Rath.jpg",
    tagline: "Tiger-striped fury. Charges first, questions never.",
    description: "A tiger-striped brawler covered in dense fur and corded muscle, built for close-quarters combat and nothing else. Strategy isn't part of the plan — it charges in loud, aggressive, and utterly relentless, trusting raw power to finish what patience never could." },
];

const total = ALIENS.length;

/* ---------------- state ---------------- */
let index = 0;
let paused = false;
let muted = true; // starts off — browsers block autoplay sound until a tap
let autoplayTimer = null;

/* ---------------- audio ---------------- */
let audioCtx = null, musicGain = null, sfxGain = null, sequenceTimer = null, noteStep = 0;
const SCALE = [196.0, 220.0, 246.9, 293.7, 329.6, 392.0, 440.0];

function getAudioCtx() {
  if (!audioCtx) {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    audioCtx = new Ctx();
    musicGain = audioCtx.createGain();
    musicGain.gain.value = 0.05;
    musicGain.connect(audioCtx.destination);
    sfxGain = audioCtx.createGain();
    sfxGain.gain.value = 0.09;
    sfxGain.connect(audioCtx.destination);
  }
  return audioCtx;
}

function pluckNote(freq, dur, dest, type) {
  if (!audioCtx || !dest) return;
  type = type || 'triangle';
  const osc = audioCtx.createOscillator();
  const env = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  env.gain.setValueAtTime(0.0001, audioCtx.currentTime);
  env.gain.exponentialRampToValueAtTime(1, audioCtx.currentTime + 0.015);
  env.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
  osc.connect(env);
  env.connect(dest);
  osc.start();
  osc.stop(audioCtx.currentTime + dur + 0.03);
}

function startMusic() {
  if (sequenceTimer) return;
  const ctx = getAudioCtx();
  if (ctx.state === 'suspended') ctx.resume();
  sequenceTimer = setInterval(() => {
    const step = noteStep;
    const freq = SCALE[step % SCALE.length];
    pluckNote(freq, 0.28, musicGain, 'triangle');
    if (step % 4 === 0) pluckNote(freq / 2, 0.4, musicGain, 'sine');
    noteStep += 1;
  }, 260);
}

function stopMusic() {
  if (sequenceTimer) {
    clearInterval(sequenceTimer);
    sequenceTimer = null;
  }
}

function playBlip() {
  if (muted) return;
  const ctx = getAudioCtx();
  if (ctx.state === 'suspended') ctx.resume();
  pluckNote(880, 0.09, sfxGain, 'square');
  setTimeout(() => pluckNote(660, 0.09, sfxGain, 'square'), 60);
}

/* ---------------- dom refs ---------------- */
const el = (id) => document.getElementById(id);
const wordmarkAccent = el('wordmark-accent');
const dialRing = el('dial-ring');
const dialCenter = el('dial-center');
const eyebrow = el('eyebrow');
const carousel = el('carousel');
const heroName = el('hero-name');
const heroTagline = el('hero-tagline');
const dotsWrap = el('dots');
const prevBtn = el('prevBtn');
const nextBtn = el('nextBtn');
const spotlight = el('spotlight');
const spotlightGlow = el('spotlight-glow');
const spotlightShadowWrap = el('spotlight-shadow-wrap');
const spotlightIconWrap = el('spotlight-icon-wrap');
const spotlightIconFallback = el('spotlight-icon-fallback');
const spotlightIconImg = el('spotlight-icon-img');
const muteBtn = el('muteBtn');
const playPauseBtn = el('playPauseBtn');
const spPrev = el('spPrev');
const spNext = el('spNext');
const spotlightLabel = el('spotlight-label');
const spotlightName = el('spotlight-name');
const spotlightDesc = el('spotlight-desc');
const spotlightBadge = el('spotlight-badge');

prevBtn.innerHTML = icon('chevronLeft', '#dfe7e0', 20);
nextBtn.innerHTML = icon('chevronRight', '#dfe7e0', 20);
spPrev.innerHTML = icon('chevronLeft', '#dfe7e0', 18);
spNext.innerHTML = icon('chevronRight', '#dfe7e0', 18);

/* build carousel cards once */
const cardEls = ALIENS.map((alien, i) => {
  const card = document.createElement('div');
  card.className = 'alien-card';
  card.addEventListener('click', () => goTo(i));

  const circle = document.createElement('div');
  circle.className = 'icon-circle';
  circle.style.position = 'relative';
  circle.style.overflow = 'hidden';

  const fallback = document.createElement('div');
  fallback.style.position = 'absolute';
  fallback.style.inset = '0';
  fallback.style.display = 'flex';
  fallback.style.alignItems = 'center';
  fallback.style.justifyContent = 'center';
  fallback.innerHTML = icon(alien.icon, '#6b7a6d', 34, 1.75);

  const img = document.createElement('img');
  img.alt = alien.name;
  img.style.position = 'absolute';
  img.style.inset = '0';
  img.style.width = '100%';
  img.style.height = '100%';
  img.style.objectFit = 'cover';
  img.style.display = 'none'; // hidden until it actually loads — no broken-image flash
  img.onload = () => { img.style.display = 'block'; fallback.style.display = 'none'; };
  img.onerror = () => { img.style.display = 'none'; fallback.style.display = 'flex'; };
  img.src = alien.image;

  circle.appendChild(fallback);
  circle.appendChild(img);

  const label = document.createElement('div');
  label.className = 'card-name';
  label.textContent = alien.name;

  card.appendChild(circle);
  card.appendChild(label);
  carousel.appendChild(card);
  return { card, circle, fallback, label };
});

/* build dots once */
const dotEls = ALIENS.map((alien, i) => {
  const dot = document.createElement('button');
  dot.className = 'dot';
  dot.setAttribute('aria-label', `Go to ${alien.name}`);
  dot.addEventListener('click', () => goTo(i));
  dotsWrap.appendChild(dot);
  return dot;
});

/* helper to replay a CSS animation on a persistent node */
function retrigger(node, className) {
  node.classList.remove(className);
  void node.offsetWidth; // force reflow
  node.classList.add(className);
}

/* ---------------- render ---------------- */
function render() {
  const active = ALIENS[index];
  const nextAlien = ALIENS[(index + 1) % total];

  // top bar
  wordmarkAccent.style.color = active.color;
  dialRing.style.border = `2px solid ${active.color}`;
  dialRing.style.boxShadow = `0 0 18px ${active.color}66`;
  dialCenter.style.background = active.color;

  // eyebrow
  eyebrow.style.color = active.color;
  eyebrow.textContent = `${active.codename} · DNA sample ${String(index + 1).padStart(2, '0')} / ${String(total).padStart(2, '0')}`;

  // carousel cards
  cardEls.forEach(({ card, circle, fallback, label }, i) => {
    let offset = i - index;
    if (offset > total / 2) offset -= total;
    if (offset < -total / 2) offset += total;

    const abs = Math.abs(offset);
    const isCenter = offset === 0;
    const visible = abs <= 3;
    const alien = ALIENS[i];

    const translateX = offset * 150;
    const scale = Math.max(1 - abs * 0.16, 0.5);
    const rotateY = offset * -38;
    const opacity = visible ? Math.max(1 - abs * 0.32, 0) : 0;
    const zIndex = 100 - abs;

    card.style.transform = `translateX(${translateX}px) scale(${scale}) rotateY(${rotateY}deg)`;
    card.style.opacity = opacity;
    card.style.zIndex = zIndex;
    card.style.pointerEvents = visible ? 'auto' : 'none';
    card.style.background = isCenter ? `linear-gradient(160deg, ${alien.color}22, #101711 60%)` : '#0e140f';
    card.style.border = isCenter ? `1px solid ${alien.color}aa` : '1px solid #23291f';
    card.style.boxShadow = isCenter ? `0 0 40px ${alien.color}40, 0 20px 40px -20px #000` : '0 10px 30px -18px #000';

    circle.style.background = isCenter ? `${alien.color}1f` : '#161d18';
    circle.style.border = `1.5px solid ${isCenter ? alien.color : '#33392f'}`;
    fallback.innerHTML = icon(alien.icon, isCenter ? alien.color : '#6b7a6d', 34, 1.75);

    label.style.color = isCenter ? '#f4f7f3' : '#7c887d';
  });

  // hero text
  heroName.textContent = active.name;
  heroTagline.textContent = active.tagline;

  // dots
  dotEls.forEach((dot, i) => {
    dot.style.width = i === index ? '22px' : '8px';
    dot.style.background = i === index ? active.color : '#2a3128';
  });

  // spotlight background + glow
  spotlight.style.background = `radial-gradient(120% 100% at 20% 15%, ${active.color}3d 0%, #0a0c0a 55%, #050605 100%)`;
  spotlightGlow.style.background = active.color;

  // spotlight shadow (next alien) — replay drift-in animation
  spotlightShadowWrap.innerHTML = icon(nextAlien.icon, nextAlien.color, 210, 1);
  retrigger(spotlightShadowWrap, 'spotlight-shadow-enter');

  // spotlight main icon — replay slide-in animation
  spotlightIconWrap.style.background = `${active.color}20`;
  spotlightIconWrap.style.border = `2px solid ${active.color}`;
  spotlightIconWrap.style.boxShadow = `0 0 60px ${active.color}55`;
  spotlightIconFallback.innerHTML = icon(active.icon, active.color, 64, 1.5);
  spotlightIconImg.style.display = 'none';
  spotlightIconFallback.style.display = 'flex';
  spotlightIconImg.onload = () => { spotlightIconImg.style.display = 'block'; spotlightIconFallback.style.display = 'none'; };
  spotlightIconImg.onerror = () => { spotlightIconImg.style.display = 'none'; spotlightIconFallback.style.display = 'flex'; };
  spotlightIconImg.src = active.image;
  retrigger(spotlightIconWrap, 'spotlight-icon-enter');

  // mute button
  muteBtn.innerHTML = muted ? icon('volumeX', '#dfe7e0', 16) : icon('volume2', '#dfe7e0', 16);
  muteBtn.setAttribute('aria-label', muted ? 'Unmute' : 'Mute');

  // play/pause button
  playPauseBtn.style.background = active.color;
  playPauseBtn.innerHTML = paused ? icon('play', '#0a0f0c', 17) : icon('pause', '#0a0f0c', 17);
  playPauseBtn.setAttribute('aria-label', paused ? 'Play' : 'Pause');

  // spotlight text — replay slide-up animation
  spotlightLabel.style.color = active.color;
  spotlightName.textContent = active.name;
  spotlightDesc.textContent = active.description;
  spotlightBadge.textContent = active.codename;
  spotlightBadge.style.color = active.color;
  spotlightBadge.style.border = `1px solid ${active.color}66`;
  retrigger(el('spotlight-text'), 'spotlight-text-enter');
}

/* ---------------- navigation ---------------- */
function go(delta) {
  index = (index + delta + total) % total;
  playBlip();
  render();
}

function goTo(i) {
  index = ((i % total) + total) % total;
  playBlip();
  render();
}

prevBtn.addEventListener('click', () => go(-1));
nextBtn.addEventListener('click', () => go(1));
spPrev.addEventListener('click', () => go(-1));
spNext.addEventListener('click', () => go(1));

/* autoplay */
function resetAutoplay() {
  if (autoplayTimer) clearInterval(autoplayTimer);
  if (!paused) {
    autoplayTimer = setInterval(() => go(1), 4200);
  }
}

document.body.addEventListener('mouseenter', () => { paused = true; resetAutoplay(); }, true);
// pause on hover over the whole app, resume on leave
document.addEventListener('mouseover', () => {}); // no-op safeguard for some browsers

const appRoot = document.body;
appRoot.addEventListener('mouseenter', () => {
  paused = true;
  resetAutoplay();
});
appRoot.addEventListener('mouseleave', () => {
  paused = false;
  resetAutoplay();
});

playPauseBtn.addEventListener('click', () => {
  paused = !paused;
  resetAutoplay();
  render();
});

/* mute / music */
muteBtn.addEventListener('click', () => {
  muted = !muted;
  if (muted) {
    stopMusic();
  } else {
    startMusic();
  }
  render();
});

/* keyboard */
window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') go(1);
  if (e.key === 'ArrowLeft') go(-1);
});

/* initial paint + autoplay start */
render();
resetAutoplay();
</script>
</body>
</html>
